[project]
name = "agentic-frameworks"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Abhiraj Gavai", email = "abhirajgawai@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.21.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli>=0.4.31",
    "pydantic-ai>=2.42.0",
    "python-dotenv>=1.2.3",
    "temporalio>=1.33.0",
]

[project.scripts]
agentic-frameworks = "agentic_frameworks:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
